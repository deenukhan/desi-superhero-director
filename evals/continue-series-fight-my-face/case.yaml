schema_version: "1.1"
name: continue-series-fight-my-face
expected_outcome: |
  Continues the series by opening on Ep 1's final image (the tractor escape at night), plans a 15-30 s fight as about 3-5 generations (wide master, slow-mo impact close-ups, bystander or reaction cutaway, comic button), uses the user's own photo or character sheet as the identity reference and asks or decides whether the face is visible or masked with the mouth free, keeps the fight slapstick and safe, and gives prompts of at most 350 words each in one paragraph.
